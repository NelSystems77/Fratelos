<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRATELOS | Pizzería & Soda Artesanal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-color: #d35400; /* Naranja quemado/Rústico */
            --dark-color: #2c3e50;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--dark-color);
            color: #fff;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 5px solid var(--primary-color);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            font-weight: 300;
            font-size: 1.1rem;
            color: #ecf0f1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-color);
            font-size: 2rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        .menu-section {
            margin-bottom: 3rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .menu-item {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .item-price {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        button {
            background-color: var(--dark-color);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: background-color 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-color);
        }

        /* Cart Styles */
        .cart-panel {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 2rem;
            height: fit-content;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 0.8rem 0;
            font-size: 0.95rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-small {
            padding: 0.2rem 0.6rem;
            width: auto;
            background-color: #ddd;
            color: #333;
        }
        
        .btn-small:hover {
            background-color: #ccc;
        }

        .cart-total {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: right;
            margin: 1.5rem 0;
            color: var(--dark-color);
        }

        .btn-whatsapp {
            background-color: #25D366;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }

        .empty-cart {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            margin: 2rem 0;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: var(--dark-color);
            color: white;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>FRATELOS</h1>
        <p>Soda & Pizzería Artesanal</p>
    </header>

    <div class="container">
        <div class="menu-container" id="menu-container">
            </div>

        <aside class="cart-panel">
            <h2 style="font-size: 1.5rem; border-bottom: none; margin-bottom: 0;">Tu Pedido</h2>
            <div id="cart-items">
                <p class="empty-cart">Aún no has agregado productos.</p>
            </div>
            <div class="cart-total" id="cart-total">
                Total: ₡0
            </div>
            <button class="btn-whatsapp" onclick="enviarPedido()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Enviar por WhatsApp
            </button>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 FRATELOS. Hecho con ❤️ para brindar el mejor sabor.</p>
    </footer>

    <script>
        // Estructura de datos basada en la imagen de la pizarra
        const menuData = [
            {
                categoria: "Desayunos",
                items: [
                    { id: 'd1', nombre: 'Pinto con carne en salsa', precio: 2500 },
                    { id: 'd2', nombre: 'Pinto económico', precio: 2000 }
                ]
            },
            {
                categoria: "Adicional de desayuno",
                items: [
                    { id: 'a1', nombre: 'Huevo', precio: 600 },
                    { id: 'a2', nombre: 'Queso', precio: 600 },
                    { id: 'a3', nombre: 'Natilla', precio: 600 },
                    { id: 'a4', nombre: 'Salchichón', precio: 600 },
                    { id: 'a5', nombre: 'Salchicha en salsa', precio: 600 }
                ]
            },
            {
                categoria: "Almuerzo",
                items: [
                    { id: 'l1', nombre: 'Casado Tradicional', precio: 3300 },
                    { id: 'l2', nombre: 'Casado para llevar', precio: 3300 }
                ]
            },
            {
                categoria: "Porciones",
                items: [
                    { id: 'p1', nombre: 'Proteína', precio: 1500 },
                    { id: 'p2', nombre: 'Verduras', precio: 900 },
                    { id: 'p3', nombre: 'Puré', precio: 900 },
                    { id: 'p4', nombre: 'Picadillo', precio: 900 },
                    { id: 'p5', nombre: 'Ensaladas', precio: 900 },
                    { id: 'p6', nombre: 'Plátanos maduros', precio: 500 },
                    { id: 'p7', nombre: 'Carne en salsa', precio: 1800 },
                    { id: 'p8', nombre: 'Arroz ó Frijoles', precio: 900 }
                ]
            }
        ];

        let carrito = [];

        // Renderizar el menú en el HTML
        function renderizarMenu() {
            const menuContainer = document.getElementById('menu-container');
            
            menuData.forEach(seccion => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'menu-section';
                
                const titulo = document.createElement('h2');
                titulo.innerText = seccion.categoria;
                sectionDiv.appendChild(titulo);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'menu-grid';

                seccion.items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';
                    itemDiv.innerHTML = `
                        <div>
                            <div class="item-name">${item.nombre}</div>
                            <div class="item-price">₡${item.precio}</div>
                        </div>
                        <button onclick="agregarAlCarrito('${item.id}', '${item.nombre}', ${item.precio})">
                            Agregar
                        </button>
                    `;
                    gridDiv.appendChild(itemDiv);
                });

                sectionDiv.appendChild(gridDiv);
                menuContainer.appendChild(sectionDiv);
            });
        }

        function agregarAlCarrito(id, nombre, precio) {
            const itemExistente = carrito.find(item => item.id === id);
            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                carrito.push({ id, nombre, precio, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function cambiarCantidad(id, delta) {
            const item = carrito.find(item => item.id === id);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.id !== id);
                }
                actualizarCarrito();
            }
        }

        function actualizarCarrito() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            
            cartItemsContainer.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                cartItemsContainer.innerHTML = '<p class="empty-cart">Aún no has agregado productos.</p>';
                cartTotal.innerText = 'Total: ₡0';
                return;
            }

            carrito.forEach(item => {
                total += item.precio * item.cantidad;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div style="flex: 1;">
                        <strong>${item.nombre}</strong><br>
                        <small>₡${item.precio} c/u</small>
                    </div>
                    <div class="cart-item-controls">
                        <button class="btn-small" onclick="cambiarCantidad('${item.id}', -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="btn-small" onclick="cambiarCantidad('${item.id}', 1)">+</button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemDiv);
            });

            cartTotal.innerText = `Total: ₡${total}`;
        }

        function generarNumeroOrden() {
            return 'ORD-' + Math.floor(1000 + Math.random() * 9000); // Ejemplo: ORD-4829
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert('Tu carrito está vacío. Agrega productos antes de realizar el pedido.');
                return;
            }

            const numeroOrden = generarNumeroOrden();
            const telefono = "50661965547";
            let total = 0;

            let mensaje = `*¡Hola FRATELOS!* 🍕🛵\nQuiero confirmar una pre-orden.\n\n`;
            mensaje += `*Número de Orden:* #${numeroOrden}\n\n`;
            mensaje += `*Detalle de mi pedido:*\n`;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `🔸 ${item.cantidad}x ${item.nombre} (₡${subtotal})\n`;
            });

            mensaje += `\n*Total a pagar:* ₡${total}\n\n`;
            mensaje += `_Por favor confírmenme el pedido y el tiempo estimado. ¡Gracias!_`;

            const urlWhatsApp = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }

        // Inicializar
        window.onload = renderizarMenu;
    </script>
</body>
</html>
